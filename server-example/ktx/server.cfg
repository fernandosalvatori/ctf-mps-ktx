// CTFNormal / KTX - configuracao independente
hostname "CTFNow - CTFNormal KTX"
sv_progtype 1
sv_progsname qwprogs
sv_gamedir ktx
maxclients 16
maxspectators 4
sv_maxrate 100000
sv_maxspeed 350
sv_accelerate 20
sv_mintic 0.013
sv_maxtic 0.03
sv_antilag 2
sv_loadentfiles 1
sv_loadentfiles_dir ctf
sv_getrealip 0
sv_use_dns 0
sv_crypt_rcon 1
sv_logfile 1
allow_download 1
allow_download_maps 1
allow_download_models 1
allow_download_sounds 1
allow_download_other 0
set k_ctfnormal 1
set k_mode 4
set k_defmode ctf
set k_allowed_free_modes 64
set k_free_mode 0
set k_matchless 1
set k_matchless_countdown 0
set k_use_matchless_dir 2
set k_lockmap 1
set k_defmap e1m1
set k_fb_enabled 0
set k_ctf_custom_models 1
set k_ctf_hook 0
set k_ctf_runes 0
set k_ctf_based_spawn 0
set k_pow 1
set k_pow_min_players 0
set k_spw 1
set k_exclusive 0
set k_overtime 0
set demo_tmp_record 0
set k_random_maplist 0
exec rotation.cfg
exec rules.cfg
exec local.cfg
serverinfo mode ctf
